<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Aura Studio ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="cute-header">
      <div class="badge">🌸 AURA STUDIO 2026 🌸</div>
      <h1>✨ Aura Studio ✨</h1>
      <p>Strike a pose with cute stickers, filters, & aesthetic frame designs!</p>
    </header>

    <main class="bento-grid">
      <!-- Left Column: Live Camera & Countdown -->
      <section class="card camera-card">
        <div class="camera-wrapper" id="cameraWrapper">
          <video id="video" autoplay playsinline></video>
          <canvas id="overlayCanvas"></canvas>
          <div id="countdown" class="countdown hidden">3</div>
          <div id="flash" class="flash"></div>
        </div>

        <div class="camera-controls">
          <button id="startBtn" class="btn-primary">📸 Start Photo Session</button>
          <button id="retakeBtn" class="btn-secondary hidden">🔄 Retake Photos</button>
        </div>
      </section>

      <!-- Middle Column: Customization Controls -->
      <section class="card controls-card">
        <!-- 1. Frame Count -->
        <div class="control-group">
          <label>🎞️ 1. Strip Frame Count</label>
          <div class="pill-grid" id="frameCountGroup">
            <button class="pill" data-count="1">1 Cut</button>
            <button class="pill" data-count="2">2 Cuts</button>
            <button class="pill" data-count="3">3 Cuts</button>
            <button class="pill active" data-count="4">4 Cuts</button>
            <button class="pill" data-count="6">6 Cuts</button>
            <button class="pill" data-count="8">8 Cuts</button>
          </div>
        </div>

        <!-- 2. Photo Cutout Shapes -->
        <div class="control-group">
          <label>💖 2. Frame Cutout Shape</label>
          <div class="pill-grid" id="shapeGroup">
            <button class="pill active" data-shape="rounded">Rounded</button>
            <button class="pill" data-shape="heart">Heart ♡</button>
            <button class="pill" data-shape="circle">Circle ○</button>
            <button class="pill" data-shape="pill">Pill 💊</button>
            <button class="pill" data-shape="scallop">Cloud ☁️</button>
            <button class="pill" data-shape="star">Star ⭐</button>
          </div>
        </div>

        <!-- 3. Artistic Frame Designs (15 Options) -->
        <div class="control-group">
          <label>🎞️ 3. Artistic Frame Designs (15 Styles)</label>
          <div class="pill-grid scrollable-pills" id="frameDesignGroup">
            <button class="pill active" data-frame="classic">✨ Clean Pastel</button>
            <button class="pill" data-frame="camera">📷 Vintage Camera</button>
            <button class="pill" data-frame="wine_seal">🍷 Wine Wax Seal</button>
            <button class="pill" data-frame="snoopy_love">💌 Cupid & Bows</button>
            <button class="pill" data-frame="disco_pink">🪩 Disco Pink Star</button>
            <button class="pill" data-frame="story_love">🌹 Story of Love</button>
            <button class="pill" data-frame="news_pin">📌 Newspaper & Pin</button>
            <button class="pill" data-frame="letter_check">📜 Letter & Gingham</button>
            <button class="pill" data-frame="film_noir">🎞️ Classic Film Roll</button>
            <button class="pill" data-frame="cherry_blush">🍒 Cherry Milk</button>
            <button class="pill" data-frame="lavender_dream">☁️ Lilac Stardust</button>
            <button class="pill" data-frame="matcha_pantry">🌿 Matcha Journal</button>
            <button class="pill" data-frame="golden_hour">🌅 Golden Hour Journal</button>
            <button class="pill" data-frame="teddy_hug">🧸 Bear Hug Aesthetic</button>
            <button class="pill" data-frame="midnight_star">🌙 Midnight Starlight</button>
          </div>
        </div>

        <!-- 4. Face Stickers & Effects -->
        <div class="control-group">
          <label>🎀 4. Kawaii Face Stickers</label>
          <div class="pill-grid" id="stickerGroup">
            <button class="pill active" data-sticker="none">Plain</button>
            <button class="pill" data-sticker="cat">🐱 Kitty</button>
            <button class="pill" data-sticker="bunny">🐰 Bunny</button>
            <button class="pill" data-sticker="bear">🧸 Teddy</button>
            <button class="pill" data-sticker="blush">🌸 Blush</button>
            <button class="pill" data-sticker="crown">👑 Tiara</button>
            <button class="pill" data-sticker="bow">🎀 Bow</button>
            <button class="pill" data-sticker="sparkles">✨ Sparkles</button>
          </div>
        </div>

        <!-- 5. Aesthetic Color Filters -->
        <div class="control-group">
          <label>🎨 5. Camera & Strip Filter</label>
          <div class="pill-grid" id="filterGroup">
            <button class="pill active" data-filter="none">Natural</button>
            <button class="pill" data-filter="peach">🍑 Peachy</button>
            <button class="pill" data-filter="strawberry">🍓 Berry</button>
            <button class="pill" data-filter="dreamy">☁️ Dreamy</button>
            <button class="pill" data-filter="mint">🌿 Mint</button>
            <button class="pill" data-filter="sunset">🌅 Sunset</button>
            <button class="pill" data-filter="vintage">🧸 Retro</button>
            <button class="pill" data-filter="bw">🐼 Mono</button>
          </div>
        </div>

        <!-- 6. Custom Text Caption -->
        <div class="control-group">
          <label>✏️ 6. Strip Header Caption</label>
          <input type="text" id="captionInput" maxlength="32" value="✨ BESTIES FOREVER ✨" placeholder="Type your custom text..." />
        </div>
      </section>

      <!-- Right Column: Live Preview & Save/Print -->
      <section class="card preview-card">
        <h3>🎀 Live Strip Preview</h3>
        <div class="strip-preview-container">
          <canvas id="stripCanvas"></canvas>
        </div>
        <div class="action-buttons">
          <button id="downloadBtn" class="btn-primary" disabled>💾 Save Strip</button>
          <button id="printBtn" class="btn-secondary" disabled>🖨️ Print Strip</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
