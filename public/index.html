<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Aura Studio ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="cute-header">
      <div class="badge">🌸 AURA STUDIO 2026 🌸</div>
      <h1>✨ Aura Studio ✨</h1>
      <p>Strike a pose with cute stickers, filters, & custom shapes!</p>
    </header>

    <main class="bento-grid">
      <!-- Left Column: Live Camera & Countdown -->
      <section class="card camera-card">
        <div class="camera-wrapper" id="cameraWrapper">
          <video id="video" autoplay playsinline></video>
          <canvas id="overlayCanvas"></canvas>
          <div id="countdown" class="countdown hidden">3</div>
          <div id="flash" class="flash"></div>
        </div>

        <div class="camera-controls">
          <button id="startBtn" class="btn-primary">📸 Start Photo Session</button>
          <button id="retakeBtn" class="btn-secondary hidden">🔄 Retake Photos</button>
        </div>
      </section>

      <!-- Middle Column: Extended Customization Controls (50+ Options) -->
      <section class="card controls-card">
        <!-- 1. Frame Count -->
        <div class="control-group">
          <label>🎞️ 1. Strip Frame Count</label>
          <div class="pill-grid" id="frameCountGroup">
            <button class="pill" data-count="1">1 Cut</button>
            <button class="pill" data-count="2">2 Cuts</button>
            <button class="pill" data-count="3">3 Cuts</button>
            <button class="pill active" data-count="4">4 Cuts</button>
            <button class="pill" data-count="6">6 Cuts</button>
            <button class="pill" data-count="8">8 Cuts</button>
          </div>
        </div>

        <!-- 2. Photo Cutout Shapes -->
        <div class="control-group">
          <label>💖 2. Frame Cutout Shape</label>
          <div class="pill-grid" id="shapeGroup">
            <button class="pill active" data-shape="rounded">Rounded</button>
            <button class="pill" data-shape="heart">Heart ♡</button>
            <button class="pill" data-shape="circle">Circle ○</button>
            <button class="pill" data-shape="pill">Pill 💊</button>
            <button class="pill" data-shape="scallop">Cloud ☁️</button>
            <button class="pill" data-shape="star">Star ⭐</button>
          </div>
        </div>

        <!-- 3. Face Stickers & Effects -->
        <div class="control-group">
          <label>🎀 3. Kawaii Face Stickers</label>
          <div class="pill-grid" id="stickerGroup">
            <button class="pill active" data-sticker="none">Plain</button>
            <button class="pill" data-sticker="cat">🐱 Kitty Ears</button>
            <button class="pill" data-sticker="bunny">🐰 Bunny Ears</button>
            <button class="pill" data-sticker="bear">🧸 Teddy Ears</button>
            <button class="pill" data-sticker="blush">🌸 Rosy Blush</button>
            <button class="pill" data-sticker="crown">👑 Tiara</button>
            <button class="pill" data-sticker="bow">🎀 Hair Bow</button>
            <button class="pill" data-sticker="sparkles">✨ Magic Sparkles</button>
          </div>
        </div>

        <!-- 4. Aesthetic Color Filters -->
        <div class="control-group">
          <label>🎨 4. Camera & Strip Filter</label>
          <div class="pill-grid" id="filterGroup">
            <button class="pill active" data-filter="none">Natural</button>
            <button class="pill" data-filter="peach">🍑 Peachy Glow</button>
            <button class="pill" data-filter="strawberry">🍓 Berry Milk</button>
            <button class="pill" data-filter="dreamy">☁️ Lavender Dream</button>
            <button class="pill" data-filter="mint">🌿 Matcha Mint</button>
            <button class="pill" data-filter="sunset">🌅 Golden Hour</button>
            <button class="pill" data-filter="vintage">🧸 Retro Polaroid</button>
            <button class="pill" data-filter="bw">🐼 Soft Mono</button>
          </div>
        </div>

        <!-- 5. Strip Paper Themes & Patterns -->
        <div class="control-group">
          <label>🍰 5. Strip Paper Theme</label>
          <div class="swatch-grid" id="themeGroup">
            <button class="swatch active" data-theme="cream" style="background:#FFFDF9;" title="Vanilla Cream"></button>
            <button class="swatch" data-theme="pink" style="background:#FFD6E0;" title="Strawberry Milk"></button>
            <button class="swatch" data-theme="lavender" style="background:#E2D4F0;" title="Lilac Dream"></button>
            <button class="swatch" data-theme="mint" style="background:#D4F4E7;" title="Matcha Mint"></button>
            <button class="swatch" data-theme="butter" style="background:#FFF3B0;" title="Lemon Butter"></button>
            <button class="swatch" data-theme="peach" style="background:#FFE5D9;" title="Peach Sorbet"></button>
            <button class="swatch" data-theme="gingham" style="background:repeating-linear-gradient(45deg,#FFE5EC,#FFE5EC 8px,#FFC2D1 8px,#FFC2D1 16px);" title="Pink Gingham"></button>
            <button class="swatch" data-theme="stars" style="background:radial-gradient(#ffb3c6 15%, transparent 16%) 0 0/12px 12px, #fffdf9;" title="Polka Dot Stars"></button>
          </div>
        </div>

        <!-- 6. Custom Text Caption -->
        <div class="control-group">
          <label>✏️ 6. Strip Header Caption</label>
          <input type="text" id="captionInput" maxlength="32" value="✨ BESTIES FOREVER ✨" placeholder="Type your custom text..." />
        </div>
      </section>

      <!-- Right Column: Live Preview & Save/Print -->
      <section class="card preview-card">
        <h3>🎀 Live Strip Preview</h3>
        <div class="strip-preview-container">
          <canvas id="stripCanvas"></canvas>
        </div>
        <div class="action-buttons">
          <button id="downloadBtn" class="btn-primary" disabled>💾 Save Strip</button>
          <button id="printBtn" class="btn-secondary" disabled>🖨️ Print Strip</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
